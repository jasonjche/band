# Cut a Band sideload IPA, attach it to a GitHub Release, and prepend the
# version to altstore-source.json on main so SideStore / AltStore pick it up.
#
# Dispatch: Actions → Release IPA → Run workflow (bump defaults to patch).
# Tag push: pushing v* builds that tag without bumping project.yml.
name: Release IPA

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch = 0.0.x, minor = 0.x.0, major = x.0.0, none = keep current)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      version:
        description: "Explicit version override, e.g. 12.2.0 (blank = apply the bump above)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-ipa
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version, maybe bump, create release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ github.event.inputs.bump }}
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          CUR=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          ICODE=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$EVENT_NAME" = "push" ]; then
            NEW="${GITHUB_REF_NAME#v}"
            echo "Tag push $GITHUB_REF_NAME → version $NEW (no source bump)"
          else
            IFS=. read -r MA MI PA <<< "$CUR"
            MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
            case "${BUMP:-patch}" in
              major) NEW="$((MA+1)).0.0" ;;
              minor) NEW="${MA}.$((MI+1)).0" ;;
              patch) NEW="${MA}.${MI}.$((PA+1))" ;;
              none|"") NEW="$CUR" ;;
              *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
            esac
            [ -n "${OVERRIDE:-}" ] && NEW="$OVERRIDE"
            echo "Dispatch: $CUR -> $NEW (bump=${BUMP:-patch})"
            if [ "$NEW" != "$CUR" ]; then
              ICODE=$((ICODE+1))
              sed -i '' -E "s/MARKETING_VERSION: \"[^\"]+\"/MARKETING_VERSION: \"$NEW\"/" project.yml
              sed -i '' -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$ICODE\"/" project.yml
              git add project.yml
              git commit -m "Release ${NEW}: bump MARKETING_VERSION + CURRENT_PROJECT_VERSION"
              git push origin "HEAD:main"
            fi
          fi

          TAG="v${NEW}"
          SHA=$(git rev-parse HEAD)
          echo "ver=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "buildVersion=$ICODE" >> "$GITHUB_OUTPUT"

          SKIP_BUILD=0
          if [ "$EVENT_NAME" = "push" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -qx "Band-ios-v${NEW}.ipa"; then
              echo "Tag push and Band-ios-v${NEW}.ipa already on $TAG — skip rebuild."
              SKIP_BUILD=1
            fi
          fi
          echo "skip_build=$SKIP_BUILD" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — assets will be refreshed."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Band ${NEW}" \
              --notes "Band **${NEW}** sideload IPA for SideStore / AltStore." \
              --target "$SHA"
          fi

      - name: Install XcodeGen
        if: steps.ver.outputs.skip_build != '1'
        run: brew install xcodegen

      - name: Build sideload IPA
        if: steps.ver.outputs.skip_build != '1'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          ./Tools/build-sideload-ipa.sh "Band-ios-v${VER}.ipa"
          cp "Band-ios-v${VER}.ipa" Band-ios-latest.ipa
          ls -l "Band-ios-v${VER}.ipa" Band-ios-latest.ipa

      - name: Upload IPA to GitHub Release
        if: steps.ver.outputs.skip_build != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          TAG="${{ steps.ver.outputs.tag }}"
          gh release upload "$TAG" "Band-ios-v${VER}.ipa" Band-ios-latest.ipa \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update AltStore / SideStore source on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          TAG="${{ steps.ver.outputs.tag }}"
          BUILD="${{ steps.ver.outputs.buildVersion }}"
          IPA="Band-ios-v${VER}.ipa"

          git fetch --no-tags origin main
          git checkout -B main origin/main

          if [ ! -f altstore-source.json ]; then
            echo "::error::altstore-source.json missing on main"
            exit 1
          fi

          SIZE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name==\"${IPA}\") | .size" || true)
          SIZE=$(printf '%s' "${SIZE:-}" | tr -d '[:space:]')
          if [ -z "${SIZE:-}" ]; then
            echo "::error::IPA asset $IPA not found on release $TAG"
            exit 1
          fi
          [ -n "${BUILD:-}" ] || BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
          DATE=$(date -u +%Y-%m-%d)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          DESC="Band ${VER}. See the release notes for what changed."
          MINOS=$(jq -r '.apps[0].minOSVersion // .apps[0].versions[0].minOSVersion // "17.0"' altstore-source.json)

          tmp=$(mktemp)
          jq \
            --arg v "$VER" --arg b "$BUILD" --arg d "$DATE" --arg desc "$DESC" \
            --arg url "$URL" --argjson size "$SIZE" --arg min "$MINOS" \
            '
            .apps[0].versions |= ([{
                version: $v, buildVersion: $b, date: $d,
                localizedDescription: $desc, downloadURL: $url, size: $size, minOSVersion: $min
              }] + (map(select(.version != $v))))
            | .apps[0].version            = $v
            | .apps[0].buildVersion       = $b
            | .apps[0].versionDate        = $d
            | .apps[0].versionDescription = $desc
            | .apps[0].downloadURL        = $url
            | .apps[0].size               = $size
            | .apps[0].minOSVersion       = $min
            ' altstore-source.json > "$tmp" && mv "$tmp" altstore-source.json

          if git diff --quiet altstore-source.json; then
            echo "altstore-source.json already current for ${VER}."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git commit -m "Release ${VER}: add to AltStore source"
          git push origin HEAD:main
